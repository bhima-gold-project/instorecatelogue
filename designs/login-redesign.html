<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Back</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#0b0e14;
    --panel:#11151d;
    --panel-2:#161b25;
    --line: rgba(255,255,255,0.08);
    --txt: #e9ecf1;
    --txt-dim: #8b93a3;
    --accent: #6ee7c8;
    --accent-2: #7c8cff;
    --danger: #ff6b6b;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    color:var(--txt);
    overflow:hidden;
    position:relative;
  }

  /* ambient animated mesh */
  .mesh{
    position:fixed; inset:-10%;
    z-index:0;
    filter: blur(60px);
    opacity:0.55;
  }
  .mesh span{
    position:absolute;
    border-radius:50%;
    mix-blend-mode:screen;
  }
  .mesh span:nth-child(1){
    width:38vw; height:38vw; left:8%; top:10%;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    animation: float1 16s ease-in-out infinite;
  }
  .mesh span:nth-child(2){
    width:32vw; height:32vw; right:6%; top:8%;
    background: radial-gradient(circle at 60% 40%, var(--accent-2), transparent 70%);
    animation: float2 20s ease-in-out infinite;
  }
  .mesh span:nth-child(3){
    width:30vw; height:30vw; left:30%; bottom:-10%;
    background: radial-gradient(circle at 50% 50%, #ff8fb1, transparent 70%);
    animation: float3 18s ease-in-out infinite;
    opacity:0.5;
  }
  @keyframes float1{
    0%,100%{ transform: translate(0,0) scale(1);}
    50%{ transform: translate(6vw,8vh) scale(1.15);}
  }
  @keyframes float2{
    0%,100%{ transform: translate(0,0) scale(1);}
    50%{ transform: translate(-7vw,5vh) scale(0.9);}
  }
  @keyframes float3{
    0%,100%{ transform: translate(0,0) scale(1);}
    50%{ transform: translate(4vw,-6vh) scale(1.1);}
  }

  /* faint grid overlay for structure */
  .grid-overlay{
    position:fixed; inset:0; z-index:1;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 75%);
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 75%);
    opacity:0.5;
    pointer-events:none;
  }

  .card{
    position:relative;
    z-index:2;
    width:380px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:38px 34px 30px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    opacity:0;
    transform: translateY(24px) scale(0.97);
    animation: cardIn 0.7s cubic-bezier(.2,.8,.2,1) 0.1s forwards;
  }
  @keyframes cardIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .badge{
    width:42px; height:42px;
    border-radius:11px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    box-shadow: 0 8px 22px -8px rgba(110,231,200,0.5);
    position:relative;
  }
  .badge::after{
    content:'';
    position:absolute; inset:0;
    border-radius:11px;
    box-shadow: 0 0 0 0 rgba(110,231,200,0.5);
    animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(110,231,200,0.45);}
    70%{ box-shadow: 0 0 0 14px rgba(110,231,200,0);}
    100%{ box-shadow: 0 0 0 0 rgba(110,231,200,0);}
  }
  .badge svg{ width:20px; height:20px; }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--txt-dim);
    font-size:14px;
    margin:0 0 28px;
  }

  .field{
    position:relative;
    margin-bottom:18px;
  }
  .field input{
    width:100%;
    background: rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 14px 8px;
    color:var(--txt);
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    outline:none;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .field input:focus{
    border-color: var(--accent);
    background: rgba(110,231,200,0.05);
  }
  .field label{
    position:absolute;
    left:14px; top:16px;
    color:var(--txt-dim);
    font-size:14.5px;
    pointer-events:none;
    transition: all 0.2s ease;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:7px;
    font-size:10.5px;
    letter-spacing:0.04em;
    color:var(--accent);
    text-transform:uppercase;
    font-family:'JetBrains Mono', monospace;
  }
  .field .underline{
    position:absolute;
    left:0; bottom:0;
    height:2px; width:0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
    border-radius: 0 0 10px 10px;
  }
  .field input:focus ~ .underline{ width:100%; }

  .row{
    display:flex;
    justify-content:flex-end;
    margin:-6px 0 22px;
  }
  .row a{
    font-size:12.5px;
    color:var(--txt-dim);
    text-decoration:none;
    transition: color 0.2s ease;
  }
  .row a:hover{ color:var(--accent); }

  button.cta{
    position:relative;
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.01em;
    color:#06140f;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    cursor:pointer;
    overflow:hidden;
    transition: transform 0.15s ease, box-shadow 0.25s ease;
    box-shadow: 0 14px 30px -12px rgba(110,231,200,0.45);
  }
  button.cta:hover{
    transform: translateY(-1px);
    box-shadow: 0 18px 36px -12px rgba(124,140,255,0.5);
  }
  button.cta:active{ transform: translateY(0px) scale(0.99); }
  button.cta::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    animation: shimmer 3.2s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ left:-60%; }
    50%{ left:130%; }
    100%{ left:130%; }
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:24px 0 18px;
    color:var(--txt-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.12em;
  }
  .divider::before, .divider::after{
    content:''; flex:1; height:1px; background:var(--line);
  }

  .footer{
    text-align:center;
    font-size:13.5px;
    color:var(--txt-dim);
  }
  .footer a{
    color:var(--accent);
    text-decoration:none;
    font-weight:500;
  }
  .footer a:hover{ text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    .mesh span, .badge::after, button.cta::before, .card{ animation:none !important; }
  }
</style>
</head>
<body>

  <div class="mesh"><span></span><span></span><span></span></div>
  <div class="grid-overlay"></div>

  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#06140f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/>
      </svg>
    </div>

    <p class="eyebrow">Secure Access</p>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to pick up right where you left off.</p>

    <form id="loginForm">
      <div class="field">
        <input type="text" id="username" placeholder=" " autocomplete="username" required>
        <label for="username">Username</label>
        <span class="underline"></span>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder=" " autocomplete="current-password" required>
        <label for="password">Password</label>
        <span class="underline"></span>
      </div>

      <div class="row">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="cta">Log in</button>
    </form>

    <div class="divider">or</div>

    <p class="footer">New here? <a href="#">Create an account</a></p>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const btn = document.querySelector('.cta');
    btn.textContent = 'Logging in…';
    btn.style.opacity = '0.85';
    setTimeout(()=>{ btn.textContent = 'Log in'; btn.style.opacity = '1'; }, 1400);
  });
</script>
</body>
</html>
